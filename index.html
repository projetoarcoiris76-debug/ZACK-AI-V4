<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ZAK — ISAAC AI</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       TELA DE LOGIN
  ========================== -->
  <section id="login-screen">

    <div class="energy-background"></div>

    <div class="login-container">

      <div class="zak-logo">
        <div class="lightning gold">⚡</div>
        <div class="lightning blue">⚡</div>
      </div>

      <h1>ZAK</h1>

      <p class="subtitle">SUA IA, SEM LIMITES</p>

      <div class="login-box">

        <h2>ENTRE NO ZAK</h2>

        <p class="login-description">
          Escolha uma forma de entrar
        </p>

        <!-- GOOGLE -->
        <button
          class="login-button google"
          id="google-login">
          <span class="login-icon">G</span>
          <span>Continuar com Google</span>
        </button>

        <!-- MICROSOFT -->
        <button
          class="login-button microsoft"
          id="microsoft-login">
          <span class="login-icon">⊞</span>
          <span>Continuar com Microsoft</span>
        </button>

        <!-- APPLE -->
        <button
          class="login-button apple"
          id="apple-login">
          <span class="login-icon">●</span>
          <span>Continuar com Apple</span>
        </button>

        <div class="login-line">
          <span>ou</span>
        </div>

        <!-- ENTRADA DE TESTE -->
        <button
          class="enter-zak"
          id="guest-login">
          ⚡ ENTRAR NO ZAK
        </button>

        <p class="security-text">
          🔒 Acesso protegido
        </p>

      </div>

    </div>

  </section>


  <!-- =========================
       HUB DO ZAK
  ========================== -->
  <section id="zak-hub" class="hidden">

    <div class="hub-background"></div>

    <div class="hub-content">

      <div class="hub-logo">
        <span class="gold">⚡</span>
        <span class="blue">⚡</span>
      </div>

      <h1>ZAK</h1>

      <p>SUA IA, SEM LIMITES</p>

      <div class="welcome-box">

        <h2>BEM-VINDO AO ZAK ⚡</h2>

        <p>
          Seu acesso foi autorizado.
        </p>

        <button id="start-chat">
          ⚡ INICIAR CONVERSA
        </button>

      </div>

    </div>

  </section>


  <script src="app.js"></script>

</body>
</html>
