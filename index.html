<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ISAAC AI | ZAK</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================
         TELA DE LOGIN
    ========================================== -->

    <main id="loginScreen" class="login-screen">

        <div class="login-container">

            <div class="zak-logo">
                ZAK
            </div>

            <div class="zak-subtitle">
                SUA IA, SEM LIMITES
            </div>

            <p class="login-title">
                ENTRAR NO ZAK
            </p>

            <!-- GOOGLE -->

            <button
                id="googleLogin"
                class="social-login google-login"
                type="button"
            >

                <span class="login-icon">
                    G
                </span>

                <span>
                    Continuar com Google
                </span>

            </button>


            <!-- MICROSOFT -->

            <button
                id="microsoftLogin"
                class="social-login microsoft-login"
                type="button"
            >

                <span class="login-icon microsoft-icon">
                    ▦
                </span>

                <span>
                    Continuar com Microsoft
                </span>

            </button>


            <!-- APPLE / ICLOUD -->

            <button
                id="appleLogin"
                class="social-login apple-login"
                type="button"
            >

                <span class="login-icon apple-icon">
                    
                </span>

                <span>
                    Continuar com Apple / iCloud
                </span>

            </button>


            <div class="login-divider">

                <span></span>

                <p>
                    ou
                </p>

                <span></span>

            </div>


            <!-- OUTRO MÉTODO -->

            <button
                id="otherLogin"
                class="other-login"
                type="button"
            >

                OUTRO MÉTODO DE LOGIN

            </button>


            <p
                id="loginMessage"
                class="login-message"
            ></p>


            <p class="login-info">

                Ao entrar, você concorda com os termos
                de uso do ZAK.

            </p>

        </div>

    </main>


    <!-- =========================================
         PAINEL DO ZAK
    ========================================== -->

    <main
        id="app"
        class="app hidden"
    >

        <header class="app-header">

            <div class="app-brand">

                <div class="brand-mark">
                    ⚡
                </div>

                <div>

                    <strong>
                        ZAK
                    </strong>

                    <small>
                        SUA IA, SEM LIMITES
                    </small>

                </div>

            </div>


            <button
                id="logoutBtn"
                class="logout-button"
                type="button"
            >

                SAIR

            </button>

        </header>


        <section class="chat-panel">

            <div class="chat-heading">

                <h1>
                    Central ZAK
                </h1>

                <p>
                    Bem-vindo ao seu assistente.
                </p>

            </div>


            <div
                id="chatMessages"
                class="chat-messages"
            >

                <div class="message zak-message">

                    <strong>
                        ZAK
                    </strong>

                    <p>
                        Login concluído! ⚡
                        Estou pronto para conversar.
                    </p>

                </div>

            </div>


            <form
                id="chatForm"
                class="chat-form"
            >

                <input
                    id="userInput"
                    type="text"
                    placeholder="Escreva sua mensagem..."
                    autocomplete="off"
                >

                <button
                    id="sendBtn"
                    type="submit"
                >

                    ENVIAR ⚡

                </button>

            </form>


            <p
                id="chatStatus"
                class="chat-status"
            >

                ZAK conectado.

            </p>

        </section>

    </main>


    <script src="app.js"></script>

</body>
</html>
