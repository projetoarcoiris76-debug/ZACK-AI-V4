<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAK — Sua IA, sem limites</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- TELA DE LOGIN -->
    <section id="login-screen" class="panel">
        <h1>ZAK <span>⚡</span></h1>
        <p>SUA IA, SEM LIMITES</p>
        <h2>ENTRAR NO ZAK</h2>
        <p>Escolha uma conta para continuar.</p>

        <button id="google-login">G Continuar com Google</button>
        <button id="microsoft-login">⊞ Continuar com Microsoft</button>
        <button id="apple-login">Continuar com Apple / iCloud</button>

        <p id="login-message" role="status"></p>
        <p>Ao entrar, você concorda com os termos de uso do ZAK.</p>
    </section>

    <!-- HUB PRINCIPAL -->
    <main id="zak-hub" class="panel" hidden>
        <header>
            <h1>⚡ ZAK</h1>
            <p>SUA IA, SEM LIMITES</p>
            <button id="logout-button">SAIR</button>
        </header>

        <h2>Central ZAK</h2>
        <p>Bem-vindo ao seu assistente.</p>

        <section id="chat">
            <div id="messages">
                <p><strong>ZAK:</strong> Login concluído! Estou pronto para conversar.</p>
            </div>

            <form id="chat-form">
                <input
                    id="user-message"
                    type="text"
                    placeholder="Escreva sua mensagem..."
                    autocomplete="off"
                    required
                >
                <button type="submit">ENVIAR ⚡</button>
            </form>
        </section>
    </main>

    <script type="module" src="login.js"></script>
</body>
</html>
