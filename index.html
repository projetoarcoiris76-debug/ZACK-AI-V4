<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ZAK — Sua IA, sem limites</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="background"></div>

  <main id="login-screen">

    <section class="zak-login">

      <div class="zak-logo">
        <div class="crossed-energy">
          <span class="energy blue"></span>
          <span class="energy gold"></span>
        </div>

        <h1>ZAK</h1>
        <p>SUA IA, SEM LIMITES</p>
      </div>

      <div class="login-box">

        <h2>FAÇA SEU LOGIN</h2>

        <p class="subtitle">
          Entre para acessar o universo do ZAK
        </p>

        <button id="google-login" class="login-button">
          <span class="google-icon">G</span>
          <span>ENTRAR COM GOOGLE</span>
        </button>

        <button id="microsoft-login" class="login-button microsoft">
          <span class="provider-icon">▦</span>
          <span>ENTRAR COM MICROSOFT</span>
        </button>

        <button id="apple-login" class="login-button apple">
          <span class="provider-icon"></span>
          <span>ENTRAR COM APPLE</span>
        </button>

        <p id="login-status" class="status">
          Escolha uma forma de entrar.
        </p>

        <div class="security">
          🔒 Login protegido pelo Firebase
        </div>

      </div>

    </section>

  </main>


  <!-- HUB DO ZAK -->

  <section id="zak-hub" class="hidden">

    <div class="hub-content">

      </div>

      </p>

      <button id="start-zak">
        ⚡ INICIAR CONVERSA
      </button>

      <button id="logout" class="logout-button">
        Sair
      </button>

    </div>

  </section>


  <script type="module" src="app.js"></script>

</body>
</html>
