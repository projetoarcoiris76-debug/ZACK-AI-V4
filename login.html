<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | ZAK AI</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="login-box">

        <div class="logo">ZAK<span>⚡</span></div>

        <h1>Bem-vindo ao ZAK</h1>

        <p class="subtitle">
            Entre na sua conta para continuar
        </p>

        <button id="google-login" class="login-button google">
            <span>G</span>
            Continuar com Google
        </button>

        <button id="microsoft-login" class="login-button microsoft">
            <span>⊞</span>
            Continuar com Microsoft
        </button>

        <button id="apple-login" class="login-button apple">
            <span>●</span>
            Continuar com Apple
        </button>

        <p id="login-message" role="status"></p>

        <p class="footer">
            Protegido por autenticação segura
        </p>

    </main>

    <script type="module" src="login.js"></script>

</body>
</html>
